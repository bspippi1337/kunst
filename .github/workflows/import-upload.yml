name: Build and publish BLCKSWAN ART release

on:
  push:
    branches: [main]
    paths:
      - "BLCKSWAN_ART_NATIVE_v1.1.0.zip"
      - ".github/workflows/import-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36"

      - name: Unpack and normalize project
        shell: bash
        run: |
          set -euo pipefail
          test -f BLCKSWAN_ART_NATIVE_v1.1.0.zip
          ROOT="$RUNNER_TEMP/blckswan-art"
          PROJECT_DIR="$ROOT/BLCKSWAN_ART_NATIVE"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q BLCKSWAN_ART_NATIVE_v1.1.0.zip -d "$ROOT"
          test -f "$PROJECT_DIR/settings.gradle.kts"

          cat > "$PROJECT_DIR/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF

          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('compileSdk = 37', 'compileSdk = 36')
          s = s.replace('targetSdk = 37', 'targetSdk = 36')
          s = s.replace('isMinifyEnabled = true', 'isMinifyEnabled = false')
          s = s.replace('isShrinkResources = true', 'isShrinkResources = false')
          s = s.replace('release {\n', 'release {\n            signingConfig = signingConfigs.getByName("debug")\n', 1)
          p.write_text(s)
          PY

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate art archive
        shell: bash
        run: python3 -m json.tool "$PROJECT_DIR/app/src/main/assets/exhibition.json" >/dev/null

      - name: Build installable release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --max-workers=2 --stacktrace clean assembleRelease

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/BLCKSWAN-ART-v1.1.0.apk"
          sha256sum "$RUNNER_TEMP/BLCKSWAN-ART-v1.1.0.apk" > "$RUNNER_TEMP/BLCKSWAN-ART-v1.1.0.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-ART-v1.1.0
          path: |
            ${{ runner.temp }}/BLCKSWAN-ART-v1.1.0.apk
            ${{ runner.temp }}/BLCKSWAN-ART-v1.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: BLCKSWAN ART Native v1.1.0
          body: |
            Native Android exhibition for BLCKSWAN ART.

            Includes 41 curated works, exhibition mode, constellation view, timeline, favourites, sharing, and the documented FUCK KUNST: DANS DANS! connection.

            The APK is signed with the Android debug key so it is directly installable. A permanent production signing key can replace it in a later release.
          make_latest: true
          files: |
            ${{ runner.temp }}/BLCKSWAN-ART-v1.1.0.apk
            ${{ runner.temp }}/BLCKSWAN-ART-v1.1.0.apk.sha256
