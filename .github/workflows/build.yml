name: Build BLCKSWAN KUNST

on:
  push:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blckswan-kunst-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Compile signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: blckswan-kunst

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install staged native source
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [ -d .v4-import ]; then
            cat .v4-import/part* | base64 -d > "$RUNNER_TEMP/blckswan-v4.tar.gz"
            tar -xzf "$RUNNER_TEMP/blckswan-v4.tar.gz" -C .
          fi
          test -s blckswan-kunst/app/src/main/assets/gallery_v4.json
          test -s blckswan-kunst/app/src/main/java/org/blckswan/art/MainActivity.kt

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "platform-tools"
          if ! find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            sdkmanager --install "build-tools;35.0.0"
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Validate native 41-work gallery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/src/main/assets/gallery_v4.json').read_text())
          works = data['works']
          assert len(works) == 41, len(works)
          assert sum(w['artType'] == 'text' for w in works) == 22
          assert sum(w['artType'] == 'source' for w in works) == 19
          assert all(w['title'] and w['meaning'] and w['what'] for w in works)
          PY
          grep -q 'gallery_v4.json' app/src/main/java/org/blckswan/art/MainActivity.kt
          grep -q 'setContent' app/src/main/java/org/blckswan/art/MainActivity.kt
          ! grep -q 'WebView' app/src/main/java/org/blckswan/art/MainActivity.kt

      - name: Compile release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 --stacktrace clean assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-v4-compiler-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare product
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/BLCKSWAN-KUNST-v4.0.0.apk"
          sha256sum "$RUNNER_TEMP/BLCKSWAN-KUNST-v4.0.0.apk" > "$RUNNER_TEMP/BLCKSWAN-KUNST-v4.0.0.apk.sha256"

      - name: Commit finished native source
        if: ${{ hashFiles('.v4-import/part*') != '' }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf .v4-import
          rm -f blckswan-kunst/local.properties
          git config user.name "BLCKSWAN KUNST autofix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Redo BLCKSWAN KUNST as a polished native gallery"
          TARGET="${{ github.head_ref || github.ref_name }}"
          git push origin "HEAD:$TARGET"

      - name: Upload finished product
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-v4.0.0
          path: |
            ${{ runner.temp }}/BLCKSWAN-KUNST-v4.0.0.apk
            ${{ runner.temp }}/BLCKSWAN-KUNST-v4.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
