name: Build BLCKSWAN KUNST

on:
  push:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: blckswan-kunst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "platform-tools"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Validate archive
        shell: bash
        run: python3 -m json.tool app/src/main/assets/exhibition.json >/dev/null

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --max-workers=2 --stacktrace clean assembleDebug

      - name: Prepare artifact
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/BLCKSWAN-KUNST.apk"
          sha256sum "$RUNNER_TEMP/BLCKSWAN-KUNST.apk" > "$RUNNER_TEMP/BLCKSWAN-KUNST.apk.sha256"
          echo "apk=$RUNNER_TEMP/BLCKSWAN-KUNST.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST
          path: |
            ${{ runner.temp }}/BLCKSWAN-KUNST.apk
            ${{ runner.temp }}/BLCKSWAN-KUNST.apk.sha256
          if-no-files-found: error
          retention-days: 30
