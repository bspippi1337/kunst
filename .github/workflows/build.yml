name: Build BLCKSWAN KUNST

on:
  push:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blckswan-kunst-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Compile signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: blckswan-kunst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "platform-tools"
          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ]; then
            sdkmanager --install "build-tools;35.0.0"
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool app/src/main/assets/exhibition.json >/dev/null
          test -f app/src/main/java/org/blckswan/art/MainActivity.kt
          test -f app/src/main/java/org/blckswan/art/ui/gallery/SpatialGallery.kt

      - name: Compile release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 --stacktrace clean assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-compiler-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare product
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/BLCKSWAN-KUNST-v2.1.0.apk"
          sha256sum "$RUNNER_TEMP/BLCKSWAN-KUNST-v2.1.0.apk" > "$RUNNER_TEMP/BLCKSWAN-KUNST-v2.1.0.apk.sha256"

      - name: Upload finished product
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-v2.1.0
          path: |
            ${{ runner.temp }}/BLCKSWAN-KUNST-v2.1.0.apk
            ${{ runner.temp }}/BLCKSWAN-KUNST-v2.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
