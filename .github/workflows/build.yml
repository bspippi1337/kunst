name: Build BLCKSWAN KUNST

on:
  push:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blckswan-kunst-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Compile signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: blckswan-kunst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "platform-tools"
          if ! find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            sdkmanager --install "build-tools;35.0.0"
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Synchronize canonical artwork
        shell: bash
        run: python3 ci/sync_canonical_art.py

      - name: Validate minimal canonical 41-work v5.2 gallery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/src/main/assets/gallery_v4.json').read_text())
          works = data['works']
          assert len(works) == 41, len(works)
          work = next(w for w in works if w['id'] == 'git-log-graffiti')
          lines = work['art'].splitlines()
          assert len(lines) == 10, len(lines)
          assert lines[3].startswith('#▄æ╥'), repr(lines[3][:8])
          assert max(map(len, lines)) >= 90
          assert work['sourceUrl'].endswith('/ungtb10d_graffiti.md')
          assert all(w['title'] and w['meaning'] and w['what'] for w in works)
          PY
          grep -q 'gallery-v52' app/src/main/java/org/blckswan/art/MainActivity.kt
          grep -q 'cardAspect(work)' app/src/main/java/org/blckswan/art/MainActivity.kt
          grep -q 'work.id == "git-log-graffiti" -> 2.75f' app/src/main/java/org/blckswan/art/MainActivity.kt
          grep -q 'work.art.trimEnd()' app/src/main/java/org/blckswan/art/MainActivity.kt
          grep -q 'versionName = "5.2.0"' app/build.gradle.kts
          ! grep -q 'WebView' app/src/main/java/org/blckswan/art/MainActivity.kt

      - name: Compile release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 --stacktrace clean assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-v5.2-compiler-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare product
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/BLCKSWAN-KUNST-v5.2.0.apk"
          sha256sum "$RUNNER_TEMP/BLCKSWAN-KUNST-v5.2.0.apk" > "$RUNNER_TEMP/BLCKSWAN-KUNST-v5.2.0.apk.sha256"

      - name: Upload finished product
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-v5.2.0
          path: |
            ${{ runner.temp }}/BLCKSWAN-KUNST-v5.2.0.apk
            ${{ runner.temp }}/BLCKSWAN-KUNST-v5.2.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
