name: Build BLCKSWAN KUNST

on:
  push:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "blckswan-kunst/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blckswan-kunst-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Compile signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: blckswan-kunst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "platform-tools"
          if ! find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            sdkmanager --install "build-tools;35.0.0"
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Validate 41-work gallery archive
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/v3.part00
          test -s app/src/main/assets/v3.part01
          cat app/src/main/assets/v3.part* | base64 -d > "$RUNNER_TEMP/blckswan-v3.tar.gz"
          tar -xzf "$RUNNER_TEMP/blckswan-v3.tar.gz" -C "$RUNNER_TEMP"
          INDEX="$RUNNER_TEMP/blckswan-kunst/app/src/main/assets/index.html"
          test -s "$INDEX"
          test "$(grep -o 'class=\"work-card\"' "$INDEX" | wc -l)" -eq 41
          grep -q 'HVA SER JEG?' "$INDEX"
          grep -q 'HVA BETYR DET?' "$INDEX"
          grep -q 'decodeGalleryHtml' app/src/main/java/org/blckswan/art/MainActivity.kt

      - name: Compile release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 --stacktrace clean assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-v3-compiler-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare product
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/BLCKSWAN-KUNST-v3.0.0.apk"
          sha256sum "$RUNNER_TEMP/BLCKSWAN-KUNST-v3.0.0.apk" > "$RUNNER_TEMP/BLCKSWAN-KUNST-v3.0.0.apk.sha256"

      - name: Upload finished product
        uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-KUNST-v3.0.0
          path: |
            ${{ runner.temp }}/BLCKSWAN-KUNST-v3.0.0.apk
            ${{ runner.temp }}/BLCKSWAN-KUNST-v3.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
